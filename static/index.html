<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>WordCraze</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preload" href="/static/style.css" as="style">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    /* Prevent FOUC - hide body until loaded */
    html { visibility: hidden; opacity: 0; transition: opacity 0.3s ease; }
    html.loaded { visibility: visible; opacity: 1; }
  </style>
</head>
<body>
  <div class="game-container">
    <header class="game-header">
      <h1>🧠 WordCraze</h1>
      <p class="subtitle">Rätsel das Wort!</p>
    </header>

    <main class="game-main">
      <section class="topic-section">
        <div id="topic-label" class="topic-label">Bereit zum Spielen?</div>
      </section>

      <section class="word-section">
        <div class="word-container">
          <div id="word" class="word">_ _ _</div>
        </div>
        <div class="input-container">
          <input id="input" type="text" maxlength="1" placeholder="?" autocomplete="off">
        </div>
      </section>

      <section class="feedback-section">
        <div id="feedback" class="feedback"></div>
        <div id="attempts" class="attempts">
          <span class="attempts-icon">💚</span>
          <span class="attempts-text">Versuche übrig: 8</span>
        </div>
      </section>

      <section class="controls-section">
        <button id="start" class="btn btn-primary">
          <span class="btn-icon">🎮</span>
          <span class="btn-text">Spiel starten</span>
        </button>
      </section>
    </main>

    <footer class="game-footer">
      <div class="game-stats">
        <div class="stat-item">
          <span class="stat-label">Runden</span>
          <span id="round-count" class="stat-value">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Punkte</span>
          <span id="score-count" class="stat-value">0</span>
        </div>
      </div>
      <div class="footer-links">
        <a href="https://bubuit.net" target="_blank" class="footer-link">bubuit.net</a>
        <span class="footer-separator">|</span>
        <a href="https://games.orangeicebear.at" target="_blank" class="footer-link" title="More games">mehr Spiele</a>
        <span class="footer-separator">|</span>
        <a href="https://github.com/oib/wordcraze" target="_blank" class="footer-link">GitHub</a>
      </div>
    </footer>
  </div>

  <script>
    // Show page once CSS is loaded
    if (document.readyState === 'complete') {
      document.documentElement.classList.add('loaded');
    } else {
      window.addEventListener('load', () => {
        document.documentElement.classList.add('loaded');
      });
    }
  </script>
  <script type="module" src="/static/app.js" defer></script>
</body>
</html>
